<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AE Business Dashboards</title>
<meta name="description" content="ตัดสินใจด้วยข้อมูล ก้าวไปอย่างมั่นใจ · หน้ารวมแดชบอร์ดของทุกบริษัทในกลุ่ม All Energy & Utilities">
<style>
/* ===== Fonts ตาม AE CI: อังกฤษ = Outfit, ไทย = IBM Plex Sans Thai (self-hosted ในโฟลเดอร์ fonts/) ===== */
@font-face{font-family:'Outfit';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/Outfit-Variable.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/IBMPlexSansThai-400.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/IBMPlexSansThai-500.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/IBMPlexSansThai-600.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/IBMPlexSansThai-700.woff2) format('woff2')}
/* ===== Theme tokens (AE CI) ===== */
:root{
  --bg:#F7F3EF; --card:#FFFFFF; --line:#EFE6DE; --line2:#E2D4C8; --ink:#2A1219; --muted:#5C4148;
  --brand:#421A26; --sand:#C49A76; --sandtx:#8A5A3F; --tint:#F3ECE6; --hero:#421A26; --herotx:#FFF7F0;
  --shadow:0 1px 2px rgba(66,26,38,.06),0 8px 24px rgba(66,26,38,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1013; --card:#24161B; --line:#35232A; --line2:#4A3239; --ink:#F6ECE6; --muted:#C9B3AA;
    --brand:#EBCFB6; --sand:#C49A76; --sandtx:#E0B994; --tint:#2E1D23; --hero:#3A1721; --herotx:#FFF7F0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#1A1013; --card:#24161B; --line:#35232A; --line2:#4A3239; --ink:#F6ECE6; --muted:#C9B3AA;
  --brand:#EBCFB6; --sand:#C49A76; --sandtx:#E0B994; --tint:#2E1D23; --hero:#3A1721; --herotx:#FFF7F0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body,header,.hero,.card,footer,.code,.tag,.logo,.chip{transition:background-color .45s ease,color .45s ease,border-color .45s ease}
body{background:var(--bg);color:var(--ink);font-family:'Outfit','IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}

/* ===== Header ===== */
header{background:var(--hero);color:var(--herotx)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.mark{font-family:'Outfit','IBM Plex Sans Thai',sans-serif;font-weight:600;font-size:30px;letter-spacing:-.02em;color:#C49A76;line-height:1}
.brand-tx{display:flex;flex-direction:column;line-height:1.15;padding-left:14px;border-left:1px solid rgba(196,154,118,.45)}
.brand-tx b{font-family:'Outfit','IBM Plex Sans Thai',sans-serif;font-weight:500;font-size:17px;letter-spacing:.01em}
.brand-tx span{font-size:12px;opacity:.75}
.seg{display:flex;padding:3px;border:1px solid rgba(196,154,118,.45);border-radius:999px}
.seg button{min-height:36px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--herotx);font:inherit;font-size:14px;cursor:pointer;opacity:.8}
.seg button[aria-pressed="true"]{background:#C49A76;color:#2A1219;opacity:1;font-weight:600}
.seg button:focus-visible,.card:focus-visible,.go:focus-visible{outline:3px solid #C49A76;outline-offset:2px}

/* ===== Hero ===== */
.hero{background:var(--hero);color:var(--herotx);padding:40px 0 56px;position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.hero-bg path{fill:none;stroke:#C49A76;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.hero-bg .l1{opacity:.22;stroke-dasharray:1800;stroke-dashoffset:1800;animation:draw 3.2s cubic-bezier(.3,.6,.2,1) .4s forwards}
.hero-bg .l2{opacity:.12;stroke-dasharray:1800;stroke-dashoffset:1800;animation:draw 3.6s cubic-bezier(.3,.6,.2,1) .9s forwards}
.hero-bg .area{fill:url(#heroFade);stroke:none;opacity:0;animation:fadein 2s ease 2.2s forwards}
.hero-bg circle{fill:#C49A76;opacity:0;animation:pulse 2.8s ease-in-out 3.4s infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.25;r:3}50%{opacity:.6;r:5}}
.hero-mark{position:absolute;right:32px;top:50%;transform:translateY(-50%);width:300px;height:auto;opacity:.9;pointer-events:none}
@keyframes drift{from{opacity:0;transform:translateY(-50%) translateX(24px)}to{opacity:.9;transform:translateY(-50%)}}
.hero-mark{animation:drift .9s cubic-bezier(.2,.7,.2,1) .1s both}
@media (max-width:900px){.hero-mark{display:none}}
.foot-logo{height:56px;width:auto;display:block}
.foot-logo.dk{display:none}
:root[data-theme="dark"] .foot-logo.lt{display:none}
:root[data-theme="dark"] .foot-logo.dk{display:block;height:32px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .foot-logo.lt{display:none}:root:not([data-theme="light"]) .foot-logo.dk{display:block;height:32px}}
.hero h1{margin:0;font-family:'Outfit','IBM Plex Sans Thai',sans-serif;font-weight:600;font-size:clamp(30px,4vw,44px);line-height:1.3;max-width:720px}
.eyebrow{display:inline-block;margin-bottom:10px;font-size:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#C49A76}
.reveal{display:block;opacity:0;transform:translateY(14px);animation:reveal .8s cubic-bezier(.2,.7,.2,1) both}
.r1{animation-delay:.15s}.r2{animation-delay:.55s}.r3{animation-delay:.95s}.r4{animation-delay:1.25s}.r5{animation-delay:1.45s}
@keyframes reveal{to{opacity:1;transform:none}}
.hero h1 .line{display:block}
.hero p{margin:14px 0 0;max-width:620px;font-size:17px;opacity:.82}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{font-size:13px;padding:4px 12px;border-radius:999px;background:rgba(196,154,118,.16);color:#F0D6BE}

/* ===== Groups & cards ===== */
main{margin-top:36px;position:relative;padding-bottom:64px}
.group{margin-bottom:36px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
.group-h h2{margin:0;font-size:19px;font-weight:600;color:var(--brand)}
.group-h span{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{min-height:230px;padding:26px 26px 22px}
.card h3{font-size:21px}
.card{display:flex;flex-direction:column;gap:12px;min-height:200px;padding:22px 22px 18px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-decoration:none;box-shadow:var(--shadow);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--sand)}
.card.feature{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:24px;row-gap:6px;padding:24px 28px;background:linear-gradient(120deg,var(--card) 50%,var(--tint))}
.card.feature .top{grid-row:1/3}
.card.feature .go{margin:0;grid-row:1/3;grid-column:3;background:var(--hero);color:var(--herotx);padding:10px 18px;border-radius:999px}
.card.feature.soon .go{background:var(--tint);color:var(--muted)}
.logo{height:44px;min-width:44px;max-width:120px;padding:4px 8px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo img{max-height:34px;max-width:104px;display:block}
.logos{display:flex;gap:6px}
.logos .logo{padding:3px 5px;max-width:72px}
.logos .logo img{max-width:60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.code{font-family:'Outfit','IBM Plex Sans Thai',sans-serif;font-weight:600;font-size:15px;letter-spacing:.04em;color:var(--brand);background:var(--tint);padding:4px 10px;border-radius:6px}
.top{flex-wrap:wrap}
.tag{font-size:12px;color:var(--sandtx);border:1px solid var(--line2);padding:1px 10px;border-radius:999px}
.card h3{margin:0;font-size:19px;font-weight:600;line-height:1.35;color:var(--ink)}
.card .en{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.card p{margin:0;font-size:14px;color:var(--muted)}
.go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--brand)}
.go svg{transition:transform .2s ease}
.card:hover .go svg{transform:translateX(4px)}
.card.soon{cursor:default;opacity:.75}
.card.soon:hover{transform:none;border-color:var(--line)}
.card.soon .go{color:var(--muted);font-weight:500}

footer{border-top:1px solid var(--line);padding:22px 0 32px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){body,header,.hero,.card,footer,.code,.tag,.logo,.chip{transition:none}.reveal{opacity:1;transform:none;animation:none}.hero-bg path,.hero-bg .area,.hero-bg circle{animation:none;stroke-dashoffset:0;opacity:.2}.hero-mark{animation:none}.card{animation:none;transition:none}.go svg{transition:none}}
@media (max-width:760px){
  .card.feature{grid-template-columns:1fr}
  .card.feature .top,.card.feature .go{grid-row:auto;grid-column:auto;justify-self:start}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .brand-tx{display:none}
  .brand img{height:32px!important}
  .grid{grid-template-columns:1fr}
  main{margin-top:24px}
  .seg button{padding:0 10px;font-size:13px}
  .hero{padding:28px 0 80px}
}

/* ===== One-screen layout (ไม่ต้องเลื่อน) ===== */
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.hero{padding:clamp(24px,7vh,88px) 0 clamp(28px,7vh,88px)}
.hero h1{max-width:none;font-size:clamp(28px,min(3.4vw,6vh),56px);line-height:1.25}
.hero h1 .seg-t{display:inline-block}
.eyebrow{margin-bottom:6px}
.hero-mark{width:auto;height:90%;max-height:clamp(80px,16vh,170px);right:32px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;margin-top:0;padding-top:24px;padding-bottom:24px}
.group{margin-bottom:0}
.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.card{min-height:clamp(0px,34vh,340px);padding:20px 20px 18px;gap:10px}
.card h3{font-size:18px}
.card p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.top{min-height:44px}
footer{padding:14px 0 16px}
.foot-logo.lt{height:40px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:1fr}.hero{padding:22px 0 26px}main{justify-content:flex-start}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="./" aria-label="AE Group หน้าแรก">
      <img src="logos/AE_logo_reverse.png" alt="All Energy &amp; Utilities" height="40" style="height:40px;width:auto;display:block">
      <span class="brand-tx"><b>Business Dashboards</b><span>ศูนย์รวมแดชบอร์ดผู้บริหาร</span></span>
    </a>
    <div class="seg" role="group" aria-label="ธีม">
      <button type="button" data-t="auto">อัตโนมัติ</button>
      <button type="button" data-t="light">สว่าง</button>
      <button type="button" data-t="dark">มืด</button>
    </div>
  </div>
</header>

<section class="hero">
  <svg class="hero-bg" viewBox="0 0 1200 360" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="heroFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C49A76" stop-opacity=".10"/><stop offset="1" stop-color="#C49A76" stop-opacity="0"/></linearGradient></defs>
    <path class="area" d="M0 300 L120 284 L240 292 L360 262 L480 270 L600 236 L720 248 L840 206 L960 214 L1080 170 L1200 150 L1200 360 L0 360 Z"/>
    <path class="l1" d="M0 300 L120 284 L240 292 L360 262 L480 270 L600 236 L720 248 L840 206 L960 214 L1080 170 L1200 150"/>
    <path class="l2" d="M0 330 L120 322 L240 326 L360 308 L480 314 L600 296 L720 300 L840 278 L960 284 L1080 258 L1200 246"/>
    <circle cx="1080" cy="170" r="3"/>
  </svg>
  <div class="wrap">
    <span class="eyebrow reveal r1">Decide with Data. Move with Confidence.</span>
    <h1><span class="seg-t reveal r2">ตัดสินใจด้วยข้อมูล</span> <span class="seg-t reveal r3">ก้าวไปอย่างมั่นใจ</span></h1>
    <img class="hero-mark" src="logos/AE_symbol.png" alt="" aria-hidden="true">
  </div>
</section>

<main class="wrap" id="groups" aria-label="รายชื่อบริษัท"></main>

<footer>
  <div class="wrap" style="align-items:center">
    <img class="foot-logo lt" src="logos/AE_logo_vertical.png" alt="All Energy &amp; Utilities Public Company Limited">
    <img class="foot-logo dk" src="logos/AE_logo_reverse.png" alt="All Energy &amp; Utilities Public Company Limited">
    <span>© <span id="yr"></span> All Energy &amp; Utilities Public Company Limited · ใช้ภายในองค์กรเท่านั้น</span>
    <span>ติดต่อฝ่ายเทคโนโลยีสารสนเทศ หากเข้าแดชบอร์ดไม่ได้</span>
  </div>
</footer>

<script>
/* =========================================================
   แก้ลิงก์และรายชื่อบริษัทตรงนี้ที่เดียว
   url: ลิงก์ปลายทาง (เว้นว่าง "" = ขึ้น "เร็ว ๆ นี้")
   logos: หลายโลโก้ในการ์ดเดียว (ใช้กับกลุ่ม STAR)
   logo: path รูปโลโก้ในโฟลเดอร์ logos/ (เว้นว่าง = แสดงตัวย่อบริษัท)
   accent: สีประจำบริษัท (แถบบนการ์ด) เช่น HEA = #3C549A ตาม Brand Guidelines
   ========================================================= */
const GROUPS = [
  {
    title: "เลือกบริษัท",
    note: "",
    items: [
      { code: "STAR", name: "กลุ่มบริษัท STAR", en: "Star Gas · Star Petroleum Plus · Tawatpinyo", tag: "สถานีแก๊สและน้ำมัน", desc: "สถานี LPG 15 สาขา (STG) สถานีน้ำมัน 5 สาขา (STP) และ NGV กับน้ำมัน (TWP) รวมในแดชบอร์ดเดียว", url: "https://energyforsociety.github.io/STG-Sales-Dashboard/",
        logos: ["logos/STG_logo.png", "logos/STP_logo.png", "logos/TWP_logo.jpg"], accent: "#C49A76" },
      { code: "HEA", name: "บริษัท ไฮโดรเอ็นเตอร์ไพร์ส แอนด์ อะควอดีซายน์ จำกัด", en: "Hydro Enterprise and Aqua Design Co., Ltd.", tag: "สาธารณูปโภค", desc: "ผลิตและจำหน่ายน้ำประปาในพื้นที่สัมปทานจากกระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม", url: "https://prapaphuket.github.io/Sales-Executive-Dashboard/",
        logo: "logos/HEA_symbol.png", accent: "#3C549A" },
      { code: "PSG", name: "บริษัท พระแสงกรีน พาวเวอร์ จำกัด", en: "Phrasaeng Green Power Co., Ltd.", tag: "พลังงานทดแทน", desc: "ผลิตและจำหน่ายไฟฟ้าจากน้ำเสียโรงงานสกัดน้ำมันปาล์ม ให้การไฟฟ้าส่วนภูมิภาค จ.สุราษฎร์ธานี", url: "",
        logo: "logos/PSG_logo.png", accent: "#148A43" },
      { code: "SAM", name: "บริษัท แซม วอเตอร์ ซัพพลาย จำกัด", en: "SAM Water Supply", tag: "สาธารณูปโภค", desc: "ออกแบบ ก่อสร้าง ติดตั้ง และบริหารงานวิศวกรรมแหล่งน้ำและสิ่งแวดล้อม", url: "",
        logo: "logos/SAM_logo.png", accent: "#1B3A64" }
    ]
  }
];

/* ---------- render ---------- */
const arrow = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const root = document.getElementById("groups");
let n = 0, i = 0;
GROUPS.forEach(g => {
  const sec = document.createElement("section");
  sec.className = "group";
  sec.setAttribute("aria-label", g.title);
  sec.innerHTML = '<div class="group-h"><h2>' + esc(g.title) + '</h2>' + (g.note ? '<span>' + esc(g.note) + '</span>' : '') + '</div><div class="grid"></div>';
  const grid = sec.querySelector(".grid");
  g.items.forEach(c => {
    n++;
    const live = !!c.url;
    const el = document.createElement(live ? "a" : "div");
    el.className = "card" + (c.feature ? " feature" : "") + (live ? "" : " soon");
    el.style.animationDelay = (i++ * 60) + "ms";
    if (c.accent) el.style.borderTop = "3px solid " + c.accent;
    if (live) { el.href = c.url; el.setAttribute("aria-label", "เปิดแดชบอร์ด " + c.name); }
    el.innerHTML =
      '<div class="top">' + (c.logos ? '<span class="logos">' + c.logos.map(function (l) { return '<span class="logo"><img src="' + esc(l) + '" alt=""></span>'; }).join('') + '</span>' : (c.logo ? '<span class="logo"><img src="' + esc(c.logo) + '" alt="' + esc(c.code) + '"></span>' : '<span class="code">' + esc(c.code) + '</span>')) + (c.tag ? '<span class="tag">' + esc(c.tag) + '</span>' : '') + '</div>' +
      '<h3>' + esc(c.name) + (c.en ? '<span class="en">' + esc(c.en) + '</span>' : '') + '</h3>' +
      (c.desc ? '<p>' + esc(c.desc) + '</p>' : '') +
      '<span class="go">' + (live ? 'เปิดแดชบอร์ด ' + arrow : 'เร็ว ๆ นี้') + '</span>';
    grid.appendChild(el);
  });
  root.appendChild(sec);
});
document.getElementById("yr").textContent = new Date().getFullYear();

/* ---------- theme (shared key with STAR dashboard) ---------- */
const KEY = "star-theme";
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
}
let saved = "auto";
try { saved = localStorage.getItem(KEY) || "auto"; } catch (e) {}
applyTheme(saved);
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  applyTheme(b.dataset.t);
  try { localStorage.setItem(KEY, b.dataset.t); } catch (e) {}
}));
</script>
</body>
</html>
